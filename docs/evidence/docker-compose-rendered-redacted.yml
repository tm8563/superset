name: superset
services:
  db:
    environment:
      BUILD_SUPERSET_FRONTEND_IN_DOCKER: "true"
      COMPOSE_PROJECT_NAME: superset
      CYPRESS_CONFIG: "false"
      DATABASE_DB: superset
      DATABASE_DIALECT: postgresql
      DATABASE_HOST: db
      DATABASE_PASSWORD: [REDACTED]
      DATABASE_PORT: "5432"
      DATABASE_USER: [REDACTED]
      DEV_MODE: "true"
      ENABLE_PLAYWRIGHT: "false"
      EXAMPLES_DB: examples
      EXAMPLES_HOST: db
      EXAMPLES_PASSWORD: [REDACTED]
      EXAMPLES_PORT: "5432"
      EXAMPLES_USER: [REDACTED]
      FLASK_DEBUG: "true"
      MAPBOX_API_KEY: [REDACTED]
      POSTGRES_DB: superset
      POSTGRES_PASSWORD: [REDACTED]
      POSTGRES_USER: [REDACTED]
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
      PYTHONPATH: /app/pythonpath:/app/docker/pythonpath_dev
      PYTHONUNBUFFERED: "1"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SUPERSET_APP_ROOT: /
      SUPERSET_DASHBOARD_POSITION_DATA_LIMIT: "1048576"
      SUPERSET_ENABLE_SWAGGER_UI: "true"
      SUPERSET_ENV: development
      SUPERSET_LOAD_EXAMPLES: 'yes'
      SUPERSET_LOG_LEVEL: info
      SUPERSET_PORT: "8088"
      SUPERSET_SECRET_KEY: [REDACTED]
    image: postgres:17
    networks:
      default: null
    ports:
      - mode: ingress
        host_ip: 127.0.0.1
        target: 5432
        published: "5432"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: volume
        source: db_home
        target: /var/lib/postgresql/data
        volume: {}
      - type: bind
        source: /home/bi-tool-ryobilao/Documents/superset/docker/docker-entrypoint-initdb.d
        target: /docker-entrypoint-initdb.d
        bind: {}
  nginx:
    command:
      - /bin/bash
      - -c
      - |
        url="http://host.docker.internal:9000/static/assets/manifest.json"
        max_attempts=300  # ~10 minutes at 2s intervals; first build can be slow
        echo "Waiting for webpack dev server at $$url..."
        attempt=0
        until curl -sf --max-time 5 -H "Host: localhost" -o /dev/null "$$url"; do
          attempt=$$((attempt + 1))
          if [ "$$attempt" -ge "$$max_attempts" ]; then
            echo "ERROR: webpack dev server did not serve $$url after $$max_attempts attempts." >&2
            echo "Is the dev server running? With BUILD_SUPERSET_FRONTEND_IN_DOCKER=false you must start it on the host (e.g. 'npm run dev' in superset-frontend)." >&2
            exit 1
          fi
          if [ $$((attempt % 15)) -eq 0 ]; then
            echo "Still waiting for webpack dev server... ($$attempt/$$max_attempts)"
          fi
          sleep 2
        done
        echo "Webpack dev server is ready; starting nginx."
        exec /docker-entrypoint.sh nginx -g 'daemon off;'
    environment:
      BUILD_SUPERSET_FRONTEND_IN_DOCKER: "true"
      COMPOSE_PROJECT_NAME: superset
      CYPRESS_CONFIG: "false"
      DATABASE_DB: superset
      DATABASE_DIALECT: postgresql
      DATABASE_HOST: db
      DATABASE_PASSWORD: [REDACTED]
      DATABASE_PORT: "5432"
      DATABASE_USER: [REDACTED]
      DEV_MODE: "true"
      ENABLE_PLAYWRIGHT: "false"
      EXAMPLES_DB: examples
      EXAMPLES_HOST: db
      EXAMPLES_PASSWORD: [REDACTED]
      EXAMPLES_PORT: "5432"
      EXAMPLES_USER: [REDACTED]
      FLASK_DEBUG: "true"
      MAPBOX_API_KEY: [REDACTED]
      POSTGRES_DB: superset
      POSTGRES_PASSWORD: [REDACTED]
      POSTGRES_USER: [REDACTED]
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
      PYTHONPATH: /app/pythonpath:/app/docker/pythonpath_dev
      PYTHONUNBUFFERED: "1"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SUPERSET_APP_ROOT: /
      SUPERSET_DASHBOARD_POSITION_DATA_LIMIT: "1048576"
      SUPERSET_ENABLE_SWAGGER_UI: "true"
      SUPERSET_ENV: development
      SUPERSET_LOAD_EXAMPLES: 'yes'
      SUPERSET_LOG_LEVEL: info
      SUPERSET_PORT: "8088"
      SUPERSET_SECRET_KEY: [REDACTED]
    extra_hosts:
      - host.docker.internal=host-gateway
    image: nginx:latest
    networks:
      default: null
    ports:
      - mode: ingress
        target: 80
        published: "80"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: bind
        source: /home/bi-tool-ryobilao/Documents/superset/docker/nginx/nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
        bind: {}
      - type: bind
        source: /home/bi-tool-ryobilao/Documents/superset/docker/nginx/templates
        target: /etc/nginx/templates
        read_only: true
        bind: {}
  redis:
    image: redis:7
    networks:
      default: null
    ports:
      - mode: ingress
        host_ip: 127.0.0.1
        target: 6379
        published: "6379"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: volume
        source: redis
        target: /data
        volume: {}
  superset:
    build:
      context: /home/bi-tool-ryobilao/Documents/superset
      dockerfile: Dockerfile
      args:
        BUILD_TRANSLATIONS: "false"
        DEV_MODE: "true"
        INCLUDE_CHROMIUM: "false"
        INCLUDE_FIREFOX: "false"
      cache_from:
        - apache/superset-cache:3.11-slim-trixie
      target: dev
    command:
      - /app/docker/docker-bootstrap.sh
      - app
    depends_on:
      superset-init:
        condition: service_completed_successfully
        required: true
    environment:
      BUILD_SUPERSET_FRONTEND_IN_DOCKER: "true"
      COMPOSE_PROJECT_NAME: superset
      CYPRESS_CONFIG: "false"
      DATABASE_DB: superset
      DATABASE_DIALECT: postgresql
      DATABASE_HOST: db
      DATABASE_PASSWORD: [REDACTED]
      DATABASE_PORT: "5432"
      DATABASE_USER: [REDACTED]
      DEV_MODE: "true"
      ENABLE_PLAYWRIGHT: "false"
      EXAMPLES_DB: examples
      EXAMPLES_HOST: db
      EXAMPLES_PASSWORD: [REDACTED]
      EXAMPLES_PORT: "5432"
      EXAMPLES_USER: [REDACTED]
      FLASK_DEBUG: "true"
      MAPBOX_API_KEY: [REDACTED]
      POSTGRES_DB: superset
      POSTGRES_PASSWORD: [REDACTED]
      POSTGRES_USER: [REDACTED]
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
      PYTHONPATH: /app/pythonpath:/app/docker/pythonpath_dev
      PYTHONUNBUFFERED: "1"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SUPERSET_APP_ROOT: /
      SUPERSET_DASHBOARD_POSITION_DATA_LIMIT: "1048576"
      SUPERSET_ENABLE_SWAGGER_UI: "true"
      SUPERSET_ENV: development
      SUPERSET_LOAD_EXAMPLES: 'yes'
      SUPERSET_LOG_LEVEL: info
      SUPERSET_PORT: "8088"
      SUPERSET_SECRET_KEY: [REDACTED]
    extra_hosts:
      - host.docker.internal=host-gateway
    networks:
      default: null
    ports:
      - mode: ingress
        target: 8088
        published: "8088"
        protocol: tcp
      - mode: ingress
        target: 8081
        published: "8081"
        protocol: tcp
    restart: unless-stopped
    user: root
    volumes:
      - type: bind
        source: /home/bi-tool-ryobilao/Documents/superset/docker
        target: /app/docker
        bind: {}
      - type: bind
        source: /home/bi-tool-ryobilao/Documents/superset/superset
        target: /app/superset
        bind: {}
      - type: bind
        source: /home/bi-tool-ryobilao/Documents/superset/superset-core
